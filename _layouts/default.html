<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Pages">
      <a href="{{ '/research/' | relative_url }}"{% if page.url contains '/research/' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/teaching/' | relative_url }}"{% if page.url contains '/teaching/' %} aria-current="page"{% endif %}>Teaching</a>
      <a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications/' %} aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url contains '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer>
  <div class="wrap">
    <p>{{ site.title }}, <a href="https://www.heidel-lab.com/">AG Heidel</a>, Hannover Medical School</p>
    <p>This is not an official website of Hannover Medical School.</p>
    <p><a href="{{ '/legal/' | relative_url }}">Legal notice</a> &middot; <a href="{{ '/privacy/' | relative_url }}">Privacy</a></p>
  </div>
</footer>
<script>
  // Builds the clickable address from its reversed parts, so it never appears in the page source.
  document.querySelectorAll('.email').forEach(function (el) {
    var rev = function (s) { return s.split('').reverse().join(''); };
    var addr = rev(el.dataset.a) + String.fromCharCode(64) + rev(el.dataset.b);
    var a = document.createElement('a');
    a.href = 'mai' + 'lto:' + addr;
    a.textContent = addr;
    el.replaceWith(a);
  });
</script>

</body>
</html>
